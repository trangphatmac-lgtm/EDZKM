name: Web workbench
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and Java tests
        shell: bash
        run: bash gradlew --no-daemon test jar
      - name: Frontend tests
        run: npm --prefix web test
      - name: Packaged application smoke test
        run: |
          python tests/test_launcher.py
          python tests/run_smoke.py
      - name: Browser tests
        shell: bash
        run: |
          cd web
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            build/reports/tests/
            build/playwright/*.png
            web/test-results/
            build/libs/zkm27.jar
